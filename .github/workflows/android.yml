name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Repo ini tidak menyertakan gradle wrapper (gradlew + gradle-wrapper.jar),
      # jadi CI memasang Gradle 8.13 sesuai gradle-wrapper.properties.
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
          log-accepted-android-sdk-licenses: true

      - name: Install Android platform & build-tools
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          sdkmanager --list_installed | grep -E 'platforms;android-36|build-tools;36'

      - name: Grant execute permission for build script
        run: chmod +x ./build-project.sh

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
